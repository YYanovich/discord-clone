services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discord
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api_1:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: discord
      DB_PASS: secret
      DB_NAME: discord
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-me
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api_2:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: discord
      DB_PASS: secret
      DB_NAME: discord
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-me
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api_3:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: discord
      DB_PASS: secret
      DB_NAME: discord
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-me
      NODE_ENV: production
      PORT: 3000
      TYPEORM_MIGRATIONS: dist/migrations/*.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api_1
      - api_2
      - api_3

volumes:
  pg_data: